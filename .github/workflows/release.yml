name: Release APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag: { description: 'Tag to release (e.g. v1.0.0)', required: true }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cp dist/VTLOdr3m3r.apk "VTLOdr3m3r-${TAG}.apk"
          # re-running for an existing tag replaces that release (and moves the tag to this commit)
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" "VTLOdr3m3r-${TAG}.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "VTLOdr3m3r ${TAG}" --generate-notes
